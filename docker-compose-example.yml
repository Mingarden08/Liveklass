version: '3.8'

services:

  app:
    build: .
    container_name: liveklass-app
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - kafka
    networks:
      - liveklass-network
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: liveklass-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "liveklass!"
      MYSQL_DATABASE: "liveklass"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/database/1-schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./src/main/resources/database/2-analysis.sql:/docker-entrypoint-initdb.d/2-analysis.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pliveklass!"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - liveklass-network
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: liveklass-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - liveklass-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: liveklass-grafana
    ports:
      - "3000:3000"
    networks:
      - liveklass-network
    restart: unless-stopped

networks:
  liveklass-network:

volumes:
  mysql-data: